<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:NSC;src:url(a/fonts/NotoSansSC.ttf);font-weight:100 900}
@font-face{font-family:Inter;src:url(a/fonts/inter-latin-700-normal.woff2);font-weight:700}@font-face{font-family:Inter;src:url(a/fonts/inter-latin-800-normal.woff2);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
#c{width:1600px;height:520px;background:#07080F;font-family:Inter,NSC;color:#E8EAF2;display:flex;align-items:center;justify-content:center;gap:18px;padding:0 40px}
.s{width:270px;height:400px;border-radius:22px;background:#11131D;border:1.5px solid #262A3B;padding:22px;position:relative;overflow:hidden}
.n{font:800 18px Inter;color:#8E9BFF;letter-spacing:3px}.t{font:900 34px NSC;margin-top:6px}.d{font:500 17px NSC;color:#8A8F98;margin-top:6px;line-height:1.5}
.v{position:absolute;left:22px;right:22px;bottom:22px;height:200px;border-radius:14px;background:#0B0C14;overflow:hidden}
.ar{font:800 34px Inter;color:#3B3F55}
</style></head><body><div id="c">
<div class="s"><div class="n">STEP 01</div><div class="t">录一段配音</div><div class="d">手机录音就行<br>音乐可自动合成</div><div class="v" id="wave"></div></div><div class="ar">›</div>
<div class="s"><div class="n">STEP 02</div><div class="t">逐字听写</div><div class="d">每个字都有时间<br>转场吸附音乐拍点</div><div class="v" id="tok"></div></div><div class="ar">›</div>
<div class="s"><div class="n">STEP 03</div><div class="t">现场设计分镜</div><div class="d">选组件、新写组件<br>规划运镜转场</div><div class="v" id="tbl"></div></div><div class="ar">›</div>
<div class="s"><div class="n">STEP 04</div><div class="t">你选、AI 自查</div><div class="d">选择题确认<br>AI 看预览帧自己修</div><div class="v" id="kf"></div></div><div class="ar">›</div>
<div class="s"><div class="n">STEP 05</div><div class="t">60fps 成片</div><div class="d">+ 3:4 / 4:3 封面<br>全程本地、免费</div><div class="v" style="background:url(../../showcase/01.jpg) center 30%/cover"></div></div>
</div><script>
wave.innerHTML='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5px">'+[...Array(26)].map((_,i)=>`<i style="display:block;width:5px;border-radius:3px;height:${18+Math.abs(Math.sin(i*.9)*Math.cos(i*.37))*120}px;background:linear-gradient(#6E8BFF,#B37BFF)"></i>`).join('')+'</div>';
tok.innerHTML='<div style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:18px">'+[['比','21.15'],['如','21.27'],['这','21.45'],['全','21.69'],['网','21.81'],['爆','22.11'],['4','22.59'],['万','22.83']].map(([c,t],i)=>`<div style="border-radius:8px;background:${i>5?'linear-gradient(135deg,#6E8BFF,#B37BFF)':'#1C1F30'};text-align:center;padding-top:8px;font:900 24px NSC">${c}<div style="font:700 11px Inter;color:${i>5?'#fff':'#7C8CFF'};margin-top:2px">${t}</div></div>`).join('')+'</div>';
tbl.innerHTML='<div style="padding:16px;font:500 12px NSC;color:#8A8F98">'+[['镜头','画面','转场'],['01','高级感','硬切'],['04','287 条','形状匹配'],['09','爆款卡片','推进穿越'],['20','片尾','拉远揭示']].map((r,i)=>`<div style="display:grid;grid-template-columns:40px 1fr 74px;padding:7px 0;border-bottom:1px solid #22263A;${i?'':'color:#E8EAF2;font-weight:800'}">${r.map(x=>`<span>${x}</span>`).join('')}</div>`).join('')+'</div>';
kf.innerHTML='<div style="position:absolute;inset:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px">'+[1,2,3,5,6,8,9,11].map(i=>`<div style="border-radius:6px;background:url(../../showcase/${String(i).padStart(2,'0')}.jpg) center/cover"></div>`).join('')+'</div><div style="position:absolute;right:10px;top:10px;font:800 13px NSC;background:#7EE787;color:#07080F;padding:3px 8px;border-radius:6px">✓ 已自查</div>';
document.fonts.ready.then(()=>setTimeout(()=>window.OK=1,600));
</script></body></html>
